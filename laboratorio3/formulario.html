<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panadería - Pedidos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: aquamarine; }
    h1 { color: blue; }
    .card { box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15); }
  </style>
</head>
<body>
  <div class="container py-5">
    <h1 class="text-center fw-bold mb-4">Panadería - Haz tu pedido</h1>

    <div class="card mx-auto" style="max-width: 500px;">
      <div class="card-body">
        <form id="pedidoForm" novalidate>

          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre">
            <div class="invalid-feedback">Escribe tu nombre.</div>
          </div>

          <div class="mb-3">
            <label for="telefono" class="form-label">Teléfono</label>
            <input type="tel" class="form-control" id="telefono">
            <div class="invalid-feedback">Escribe tu teléfono.</div>
          </div>

          <div class="mb-3">
            <label for="producto" class="form-label">Producto</label>
            <select class="form-select" id="producto">
              <option value="">Selecciona un producto</option>
              <option>Pan francés</option>
              <option>Pan integral</option>
              <option>Croissant</option>
              <option>Empanada</option>
              <option>Torta</option>
            </select>
            <div class="invalid-feedback">Selecciona un producto.</div>
          </div>

          <div class="mb-3">
            <label for="cantidad" class="form-label">Cantidad</label>
            <input type="number" class="form-control" id="cantidad" min="1">
            <div class="invalid-feedback">Escribe una cantidad mayor a 0.</div>
          </div>

          <div class="mb-3">
            <label for="fecha" class="form-label">Fecha de entrega</label>
            <input type="date" class="form-control" id="fecha">
            <div class="invalid-feedback">Selecciona la fecha de entrega.</div>
          </div>

          <button type="submit" class="btn btn-primary">Enviar pedido</button>
        </form>
      </div>
    </div>

    <div class="text-center mt-4">
      <a href="../index.html" class="btn btn-secondary">← Volver al inicio</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.getElementById("pedidoForm").addEventListener("submit", function (e) {
      e.preventDefault();
      let valido = true;

      const nombre = document.getElementById("nombre");
      const telefono = document.getElementById("telefono");
      const producto = document.getElementById("producto");
      const cantidad = document.getElementById("cantidad");
      const fecha = document.getElementById("fecha");

      // Si una casilla está vacía, se marca en rojo y no se envía
      function revisar(campo, condicionVacio) {
        if (condicionVacio) {
          campo.classList.add("is-invalid");
          valido = false;
        } else {
          campo.classList.remove("is-invalid");
        }
      }

      revisar(nombre, nombre.value.trim() === "");
      revisar(telefono, telefono.value.trim() === "");
      revisar(producto, producto.value === "");
      revisar(cantidad, cantidad.value === "" || Number(cantidad.value) < 1);
      revisar(fecha, fecha.value === "");

      if (valido) {
        alert("Pedido enviado correctamente");
        this.reset();
      }
    });
  </script>
</body>
</html>
