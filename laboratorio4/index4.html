<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: aquamarine; }
        h1 { color: blue; }
        .card { box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15); }
    </style>
</head>
<body>
    <div class="container py-5">
        <h1 class="text-center fw-bold mb-4">Mi Lista de Tareas</h1>

        <div class="card mx-auto" style="max-width: 500px;">
            <div class="card-body">
                <div class="input-group mb-3">
                    <input type="text" class="form-control" id="tareaInput" placeholder="Escribe una tarea">
                    <button class="btn btn-primary" id="agregarBtn">Agregar</button>
                </div>

                <ul class="list-group" id="listaTareas"></ul>
            </div>
        </div>

        <div class="text-center mt-4">
            <a href="../index.html" class="btn btn-secondary">← Volver al inicio</a>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
