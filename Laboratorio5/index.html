<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi primera página con Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Mi Sitio</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link active" href="#">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Servicios</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">

    <div class="row">
      <div class="col-md-4 bg-primary text-white">Columna 1</div>
      <div class="col-md-4 bg-success text-white">Columna 2</div>
      <div class="col-md-4 bg-danger text-white">Columna 3</div>
    </div>

    <div class="card mt-4" style="width: 18rem;">
      <img src="https://via.placeholder.com/150" class="card-img-top" alt="imagen">
      <div class="card-body">
        <h5 class="card-title">Título de la tarjeta</h5>
        <p class="card-text">Este es un ejemplo de tarjeta con Bootstrap.</p>
        <a href="#" class="btn btn-primary">Leer más</a>
      </div>
    </div>

    <form class="mt-4" id="formulario" novalidate>
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="nombre">
        <div class="invalid-feedback">Por favor, escribe tu nombre.</div>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Correo Electrónico</label>
        <input type="email" class="form-control" id="email">
        <div class="invalid-feedback">Por favor, escribe tu correo.</div>
      </div>
      <button type="submit" class="btn btn-success">Enviar</button>
    </form>

    <a href="../index.html" class="btn btn-secondary my-4">← Volver al inicio</a>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.getElementById("formulario").addEventListener("submit", function (e) {
      e.preventDefault(); // siempre se frena el envío, luego se decide

      const nombre = document.getElementById("nombre");
      const email = document.getElementById("email");
      let valido = true;

      if (nombre.value.trim() === "") {
        nombre.classList.add("is-invalid");
        valido = false;
      } else {
        nombre.classList.remove("is-invalid");
      }

      if (email.value.trim() === "") {
        email.classList.add("is-invalid");
        valido = false;
      } else {
        email.classList.remove("is-invalid");
      }

      if (valido) {
        alert("Formulario enviado correctamente");
        this.reset();
      }
    });
  </script>
</body>
</html>
